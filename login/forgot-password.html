<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Layer 8</title>
    <!-- Theme (tokens first, then fonts + shared classes) -->
    <link rel="stylesheet" href="../shared/layer8d-theme-tokens.css">
    <link rel="stylesheet" href="../shared/layer8d-theme.css">
    <!-- Login Styles (load in order) -->
    <link rel="stylesheet" href="layer8d-login-base.css">
    <link rel="stylesheet" href="layer8d-login-forms.css">
    <link rel="stylesheet" href="layer8d-login-components.css">
    <!-- Captcha row + status message -->
    <link rel="stylesheet" href="layer8d-recovery.css">
</head>
<body>
    <div class="layer8d-login-container">
        <div class="layer8d-login-card">
            <!-- Header with App Logo and Title -->
            <div class="layer8d-login-header">
                <img src="/l8ui/images/logo.svg" alt="Application Logo" class="app-logo" onerror="this.style.display='none'">
                <div class="title-with-icon">
                    <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <h1 class="app-title">Forgot Password</h1>
                </div>
                <p class="app-description">We'll email you a link to set a new password</p>
            </div>

            <div class="layer8d-login-form">
                <!-- Status Message -->
                <div id="message" class="message"></div>

                <form id="forgot-form">
                    <div class="form-group">
                        <label for="user-id">Username or Email</label>
                        <input type="text" id="user-id" name="user-id" placeholder="Enter your username or email" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="captcha">Captcha</label>
                        <div class="layer8d-captcha-container">
                            <img id="captcha-image" alt="Captcha" src="">
                            <button type="button" id="refresh-captcha" class="layer8d-btn-refresh" title="Refresh Captcha">&#8635;</button>
                        </div>
                        <input type="text" id="captcha" name="captcha" placeholder="Enter captcha text" autocomplete="off" required>
                    </div>
                    <button type="submit" id="forgot-btn" class="layer8d-btn-login">
                        <span id="btn-spinner" class="spinner" style="display: none;"></span>
                        <span id="btn-text">Send reset link</span>
                    </button>
                </form>

                <div class="layer8d-register-link">
                    <span>Remembered it?</span>
                    <a href="index.html">Back to login</a>
                </div>
            </div>

            <!-- Theme Toggle -->
            <div style="text-align: center; padding: 8px;">
                <button class="layer8d-theme-toggle" onclick="Layer8DThemeSwitcher.toggle()" aria-label="Switch to dark mode" style="background: none; border: 1px solid var(--layer8d-border); border-radius: var(--layer8d-radius-md); padding: 6px 8px; cursor: pointer; color: var(--layer8d-text-medium); transition: all 0.2s;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>

            <!-- Footer with Layer 8 Branding -->
            <div class="layer8d-login-footer">
                <div class="ecosystem-branding">
                    <img src="Layer8Logo.gif" alt="Layer 8" class="ecosystem-logo" onerror="this.style.display='none'">
                    <span class="ecosystem-text">Layer 8 Ecosystem</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Theme Switcher (load before other scripts) -->
    <script src="../shared/layer8d-theme-switcher.js"></script>
    <script>Layer8DThemeSwitcher.init();</script>

    <script src="layer8d-login-config.js"></script>
    <script src="../shared/layer8d-logo.js"></script>
    <script src="../shared/layer8d-captcha-widget.js"></script>
    <script src="layer8d-forgot-password.js"></script>
</body>
</html>
