<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="App logo">
  <!-- Face colors mirror the active theme's primary light/base/dark
       triad (layer8d-theme-tokens.css). Hex values below are the light
       theme's defaults, used as-is when opened standalone;
       layer8d-logo.js substitutes the active theme's resolved colors in
       place of these three exact hex strings before use. -->
